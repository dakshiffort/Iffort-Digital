<!DOCTYPE html>
<html lang="en" class="scroll-smooth scroll-pt-28">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iffort | Precision Execution. Real-World Results.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              iffort: {
                navy: '#0f172a', // Deep slate/navy
                dark: '#020617', // Darker background
                pink: '#FF2E63', // Hot pink from brochure
                blue: '#00C9FF', // Electric blue accent
                gray: '#F3F4F6'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'draw': 'draw 1.5s ease-out forwards',
            },
            keyframes: {
              draw: {
                '0%': { width: '0%', opacity: '0' },
                '100%': { width: '100%', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .gradient-text {
        background: linear-gradient(90deg, #FFFFFF 0%, #00C9FF 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .accent-gradient-text {
        background: linear-gradient(90deg, #FF2E63 0%, #FF9F1C 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>

    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
