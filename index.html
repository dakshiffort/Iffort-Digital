<!DOCTYPE html>
<html lang="en" class="scroll-smooth scroll-pt-28">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iffort | Precision Execution. Real-World Results.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              iffort: {
                navy: '#0f172a', // Deep slate/navy
                dark: '#020617', // Darker background
                pink: '#FF2E63', // Hot pink from brochure
                blue: '#00C9FF', // Electric blue accent
                gray: '#F3F4F6'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'draw': 'draw 1.5s ease-out forwards',
            },
            keyframes: {
              draw: {
                '0%': { width: '0%', opacity: '0' },
                '100%': { width: '100%', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .gradient-text {
        background: linear-gradient(90deg, #FFFFFF 0%, #00C9FF 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .accent-gradient-text {
        background: linear-gradient(90deg, #FF2E63 0%, #FF9F1C 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Particle Flow Animations */
      @keyframes particleFlow {
        0% { offset-distance: 0%; opacity: 0; }
        5% { offset-distance: 5%; opacity: 1; }
        95% { offset-distance: 95%; opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }

      @keyframes particleGlow {
        0%, 100% { filter: brightness(1) drop-shadow(0 0 4px currentColor); }
        50% { filter: brightness(1.5) drop-shadow(0 0 8px currentColor); }
      }

      @keyframes particleGlowEnhanced {
        0%, 100% { filter: brightness(1.3) drop-shadow(0 0 6px currentColor); }
        50% { filter: brightness(2) drop-shadow(0 0 12px currentColor); }
      }

      /* Hub Pulse Animations */
      @keyframes hubPulse {
        0%, 100% {
          box-shadow: 0 0 60px rgba(0, 0, 0, 0.5),
                      0 0 30px rgba(0, 201, 255, 0.1),
                      inset 0 0 20px rgba(0, 201, 255, 0.05);
        }
        50% {
          box-shadow: 0 0 60px rgba(0, 0, 0, 0.5),
                      0 0 50px rgba(0, 201, 255, 0.2),
                      inset 0 0 30px rgba(0, 201, 255, 0.1);
        }
      }

      @keyframes hubInnerRing {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }

      /* Particle Base Styles */
      .particle {
        will-change: transform, opacity;
        offset-rotate: 0deg;
      }

      /* Accessibility: Respect reduced motion preference */
      @media (prefers-reduced-motion: reduce) {
        .particle, [class*="animate-hub"] {
          animation: none !important;
        }
      }

      /* Z-index utility for video overlay */
      .z-5 {
        z-index: 5;
      }

      /* Hero Video Accessibility */
      @media (prefers-reduced-motion: reduce) {
        .hero-video {
          animation: none !important;
          display: none !important;
        }
      }

      /* Data Visualization Chart Animations */
      @keyframes drawChart {
        0% {
          stroke-dashoffset: 200;
          opacity: 0.5;
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
      }

      @keyframes pulseGlow {
        0%, 100% {
          filter: drop-shadow(0 0 4px rgba(0, 201, 255, 0.6));
        }
        50% {
          filter: drop-shadow(0 0 12px rgba(0, 201, 255, 0.8));
        }
      }

      @keyframes fadeIn {
        0% {
          opacity: 0;
          transform: scale(0.5);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* Chart Accessibility: Respect reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .chart-animation .chart-line,
        .chart-animation .chart-dot {
          animation: none !important;
          opacity: 1 !important;
          stroke-dashoffset: 0 !important;
          transform: scale(1) !important;
        }
      }

      /* Impact Stats Floating Particles Animation */
      @keyframes floatParticle {
        0% {
          transform: translateY(0) translateX(0);
          opacity: 0;
        }
        10% {
          opacity: 0.5;
        }
        90% {
          opacity: 0.5;
        }
        100% {
          transform: translateY(-100px) translateX(var(--float-offset, 0));
          opacity: 0;
        }
      }

      /* Accessibility: Respect reduced motion preference for particles */
      @media (prefers-reduced-motion: reduce) {
        .impact-particle {
          animation: none !important;
          display: none !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body class="bg-iffort-dark text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
